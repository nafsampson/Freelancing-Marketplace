services:
  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    environment:
      MONGODB_URI: mongodb://mongo:27017/hustlehub_ci
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const https = require('node:https');
          const req = https.get('https://127.0.0.1:4000/health',
          { rejectUnauthorized: false },
          res => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); });
          req.setTimeout(4000, () => req.destroy(new Error('Health check timed out')));
          req.on('error', err => { console.error(err.message); process.exit(1); });
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    depends_on:
      backend:
        condition: service_healthy