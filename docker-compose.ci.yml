services:
  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    environment:
      MONGODB_URI: mongodb://mongo:27017/hustlehub_ci
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    depends_on:
      backend:
        condition: service_healthy
