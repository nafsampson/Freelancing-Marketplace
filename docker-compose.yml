#REFERENCE module manual pg 147
services:

#building the backend using its docker file
  backend:
    build: ./Backend
    ports:
      - "127.0.0.1:4000:4000"

    env_file:
      - ./Backend/.env

    environment:
      PORT: 4000
      USE_HTTPS: "true"
      CLIENT_ORIGIN: "https://localhost:8443"
      SSL_KEY_PATH: /app/certs/localhost-key.pem
      SSL_CERT_PATH: /app/certs/localhost-cert.pem

    volumes:
      - ./Backend/certs:/app/certs:ro
#building the frontend using its docker file
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "https://localhost:4000/api"

    ports:
      - "127.0.0.1:8443:443"

    volumes:
      - ./Backend/certs:/etc/nginx/certs:ro

    depends_on:
      - backend